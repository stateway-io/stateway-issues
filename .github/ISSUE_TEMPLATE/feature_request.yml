name: Feature Request
description: Suggest an idea or improvement for stateway
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! A clear proposal helps the agent evaluate it effectively.

  - type: input
    id: title
    attributes:
      label: Summary
      description: A short, clear description of your suggestion
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed? Describe the feature in detail.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: What problem does this solve? Who would benefit from it?
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: Current workaround
      description: Is there a way to achieve this today, even if it's not ideal?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - low
        - medium
        - high
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: If applicable, attach mockups, diagrams, or reference screenshots.
    validations:
      required: false
